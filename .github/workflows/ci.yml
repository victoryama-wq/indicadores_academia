name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  angular:
    name: Validación Angular
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obtener código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.1'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar demo
        run: npm run build

      - name: Ejecutar pruebas unitarias
        run: npm test

      - name: Verificar compatibilidad de dependencias
        run: npm run test:dependencies

      - name: Verificar lector Moodle con datos ficticios
        run: npm run test:moodle

      - name: Compilar la vista privada de Coordinación
        run: npm run build:vista

      - name: Configurar Node.js para la función de vista previa
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: preview/functions/package-lock.json

      - name: Instalar dependencias de la función
        run: npm ci --engine-strict --prefix preview/functions

      - name: Comprobar acceso a la vista previa con identidades ficticias
        run: node --test preview/functions/gateway.test.mjs

  e2e-edge:
    name: E2E Edge
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Obtener código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.1'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Microsoft Edge y dependencias del sistema
        run: npx playwright install --with-deps msedge

      - name: Ejecutar E2E con Edge
        run: npm run test:e2e

      - name: Compilar el piloto local
        run: npm run build

      - name: Validar piloto Moodle en Edge con datos ficticios
        run: npm run test:moodle:ui

      - name: Conservar reporte y resultados de Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-edge
          path: |
            playwright-report/
            test-results/
          retention-days: 7
