name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  angular:
    name: Validación Angular
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obtener código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.1'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar demo
        run: npm run build

      - name: Ejecutar pruebas unitarias
        run: npm test

      - name: Verificar compatibilidad de dependencias
        run: npm run test:dependencies

  e2e-edge:
    name: E2E Edge
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Obtener código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.1'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Evitar el espejo APT de Azure con fallos de DNS
        run: |
          # Conserva los espejos oficiales archive.ubuntu.com y security.ubuntu.com.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '\|^http://azure\.archive\.ubuntu\.com/ubuntu/|d' /etc/apt/apt-mirrors.txt
          fi

      - name: Instalar Microsoft Edge y dependencias del sistema
        run: npx playwright install --with-deps msedge

      - name: Ejecutar E2E con Edge
        run: npm run test:e2e

      - name: Conservar reporte y resultados de Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-edge
          path: |
            playwright-report/
            test-results/
          retention-days: 7
